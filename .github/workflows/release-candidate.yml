name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release candidate version, matching plugin header and readme Stable tag"
        required: true
        type: string

jobs:
  runtime-smoke:
    name: runtime-smoke (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            php-version: "8.0"
            wordpress-version: "6.9.4"
            project-name: npcink_abilities_rc_wp69_php80
            http-port: "8901"
          - name: current
            php-version: "8.5"
            wordpress-version: "7.0"
            project-name: npcink_abilities_rc_wp70_php85
            http-port: "8902"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run WordPress runtime smoke
        env:
          MINIMUM_WP_VERSION: ${{ matrix.wordpress-version }}
          MINIMUM_WP_PHP_VERSION: ${{ matrix.php-version }}
          MINIMUM_WP_PROJECT_NAME: ${{ matrix.project-name }}
          MINIMUM_WP_HTTP_PORT: ${{ matrix.http-port }}
          WORDPRESS_SMOKE_LABEL: ${{ matrix.name }}
        run: composer smoke:wp-minimum

  package:
    needs: runtime-smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.0"
          coverage: none

      - name: Validate composer metadata
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run source gate
        run: composer test:all

      - name: Run PHPStan
        run: composer analyse:phpstan

      - name: Build release candidate zip
        run: VERSION="${{ inputs.version }}" composer release:zip

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v7
        with:
          name: npcink-abilities-toolkit-${{ inputs.version }}
          path: dist/npcink-abilities-toolkit-${{ inputs.version }}.zip
          if-no-files-found: error
